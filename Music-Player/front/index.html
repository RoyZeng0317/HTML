<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Music Player</title>
    </head>
    <body>
        <div class="container">
            <div class="box form-box">
                <header>Music Player</header>
                <a href="#" onclick="Search(event)" id="search-btn" class="text">🔍 搜尋</a>
                <form action="" method="post">
                    <div class="song-input" id="song-input">
                        <input type="text" id="search" class="search" onkeyup="onSearch()" placeholder="Search for song...">
                        <button type="button" class="add-btn" onclick="onAdd()">Add</button>
                    </div>
                    
                    <div class="song-upload">
                        <input type="file" id="file-input" accept=".mp3" style="display: none;" onchange="onFileSelected(event)">
                    </div>
                    <a href="#" onclick="SongList(event)" id="song-list-btn" class="text">🎵歌曲列表</a>
                    <div>
                        <ul id="list" class="list">
                            <li><span class="text">載入歌曲中...</span></li>
                        </ul>
                    </div>
                    <div class="queue" id="queue">
                        <strong>Queue:</strong>
                    </div>
                    <div class="lyrics" id="lyrics-box">
                        <ul id="lyrics-list" class="lyrics-list"></ul>
                    </div>
                    <audio src="" class="player" id="audio" controls autoplay ></audio>
                    <div class="floatHint" id="floatHint"></div>
                    <div class="msgbox" id="msgbox">
                        <ul class="msg-list">
                            <span>Operation Tips</span>
                            <li>space : play/pause</li>
                            <li>↑ / ↓ : volume control</li>
                            <li>← / → : remove / add progress 5 seconds</li>
                            <li>/ : focus search bar</li>
                            <li>esc : unfocus search bar</li>
                            <li>? : show/hide operation tips</li>
                        </ul>
                    </div>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="lyrics.js"></script>
    </body>
</html>

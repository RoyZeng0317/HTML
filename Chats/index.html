<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <title>Chats</title>
    </head>
    <body>
        <span>Chats</span>
        <form action="">
            <div class="chat-container">
                <div class="messages" id="messages"></div>
                <div class="input-container">
                    <input type="text" class="user" id="user" placeholder="Your Name">
                    <input type="text" class="msg" id="msg" placeholder="Enter the message">
                    <button type="button" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </form>
    </body>
    <script src="script.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</html>
